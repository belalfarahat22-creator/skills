name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml python-pptx python-docx openpyxl
      - name: Check every skill against the Agent Skills spec
        run: python3 scripts/validate_skills.py
      - name: Unit tests for the etisalat-brand helper
        run: python3 -m unittest discover -s skills/etisalat-brand/scripts -v
